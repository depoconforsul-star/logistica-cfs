<div class="card border-green">
            <h3>Data / Horário <span>*</span></h3>
            <div class="tip-box">💡 Selecione a janela operacional desejada. Horários já ocupados ficam bloqueados.</div>
            <div id="horariosContainer" class="radio-group">
                <span class="loading-text">Selecione uma Semana de Referência para listar os horários...</span>
            </div>
        </div>

        <button type="submit" class="btn-submit">Confirmar Agendamento de Caminhão</button>
    </form>
</div>
<script>
    const horariosPadrao = ["07:00 - 09:00", "09:00 - 11:00", "12:00 - 14:00", "14:00 - 16:30"];
    
    function toggleAdmin() { document.getElementById('adminPanel').classList.toggle('hidden'); }
    
    function saveAdmin() {
        localStorage.setItem('scriptUrlLogistica', document.getElementById('scriptUrl').value);
        alert('URL de integração salva com sucesso!');
        toggleAdmin();
        carregarHorariosDisponiveis();
    }

    function gerarSemanas() {
        const select = document.getElementById('semana');
        select.innerHTML = '<option value="">Escolher</option>';
        
        // CONFIGURADO: Gera semanas de 2026 a partir da Semana 45 (Início em 02/11/2026)
        let dataAux = new Date(2026, 10, 2);
        for(let s = 45; s <= 52; s++) {
            let fim = new Date(dataAux); fim.setDate(dataAux.getDate() + 4);
            let txt = `Semana ${s} (2026) - ${dataAux.toLocaleDateString('pt-BR').substring(0,5)} a ${fim.toLocaleDateString('pt-BR').substring(0,5)}`;
            select.options.add(new Option(txt, `SEMANA ${s} (2026)`));
            dataAux.setDate(dataAux.getDate() + 7);
        }

        // Gera todas as 52 semanas de 2027
        dataAux = new Date(2027, 0, 4);
        for(let s = 1; s <= 52; s++) {
            let fim = new Date(dataAux); fim.setDate(dataAux.getDate() + 4);
            let txt = `Semana ${s} (2027) - ${dataAux.toLocaleDateString('pt-BR').substring(0,5)} a ${fim.toLocaleDateString('pt-BR').substring(0,5)}`;
            select.options.add(new Option(txt, `SEMANA ${s} (2027)`));
            dataAux.setDate(dataAux.getDate() + 7);
        }
        
        if(localStorage.getItem('scriptUrlLogistica')) {
            document.getElementById('scriptUrl').value = localStorage.getItem('scriptUrlLogistica');
        }
    }

    function carregarHorariosDisponiveis() {
        const url = localStorage.getItem('scriptUrlLogistica');
        const semanaSel = document.getElementById('semana').value;
        const container = document.getElementById('horariosContainer');

        if (!semanaSel) {
            container.innerHTML = '<span class="loading-text">Selecione uma Semana de Referência para listar os horários...</span>';
            return;
        }

        container.innerHTML = '<span class="loading-text">Consultando horários disponíveis na planilha...</span>';

        if (!url) {
            renderizarInterfaceHorarios([]);
            return;
        }

        fetch(`${url}?semana=${encodeURIComponent(semanaSel)}`)
            .then(res => res.json())
            .then(data => {
                renderizarInterfaceHorarios(data);
            })
            .catch(() => {
                renderizarInterfaceHorarios([]);
            });
    }

    function renderizarInterfaceHorarios(listaOcupados) {
        const container = document.getElementById('horariosContainer');
        container.innerHTML = "";

        const diasSemana = [
            { nome: "SEGUNDA-FEIRA", id: "SEGUNDA-FEIRA" },
            { nome: "TERÇA-FEIRA", id: "TERÇA-FEIRA" },
            { nome: "QUARTA-FEIRA", id: "QUARTA-FEIRA" },
            { nome: "QUINTA-FEIRA", id: "QUINTA-FEIRA" },
            { nome: "SEXTA-FEIRA", id: "SEXTA-FEIRA" }
        ];

        diasSemana.forEach(dia => {
            horariosPadrao.forEach(horario => {
                const identificadorUnico = `${dia.id} - ${horario}`;
                const estaOcupado = listaOcupados && listaOcupados.includes(identificadorUnico);

                const item = document.createElement('label');
                item.className = `radio-item ${estaOcupado ? 'occupied' : ''}`;

                const input = document.createElement('input');
                input.type = "radio";
                input.name = "dataHorario";
                input.value = identificadorUnico;
                input.required = true;
                if(estaOcupado) input.disabled = true;

                item.appendChild(input);
                item.appendChild(document.createTextNode(`${dia.nome} — [ ${horario} ] ${estaOcupado ? ' ❌ (OCUPADO)' : ' 🟢 (DISPONÍVEL)'}`));
                container.appendChild(item);
            });
        });
    }

    function enviarDados(e) {
        e.preventDefault();
        const url = localStorage.getItem('scriptUrlLogistica');
        if (!url) return alert("Por favor, configure o link da planilha no Painel Administrativo!");

        const form = document.getElementById('logisticaForm');
        const horaSelecionada = form.elements['dataHorario'].value;
        const semanaSelecionada = document.getElementById('semana').value;
        const container = document.getElementById('horariosContainer');

        container.innerHTML = '<span class="loading-text">Salvando agendamento...</span>';

        const urlFinal = `${url}?solicitante=${encodeURIComponent(document.getElementById('solicitante').value)}&partida=${encodeURIComponent(document.getElementById('partida').value)}&destino=${encodeURIComponent(document.getElementById('destino').value)}&nivelCarga=${encodeURIComponent(document.getElementById('nivelCarga').value)}&dataHorario=${encodeURIComponent(horaSelecionada)}&semana=${encodeURIComponent(semanaSelecionada)}`;

        fetch(urlFinal, { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    alert('Agendamento confirmado com sucesso e lançado no painel do motorista!');
                    form.reset();
                    carregarHorariosDisponiveis();
                } else {
                    alert('Erro ao agendar: ' + data.message);
                    carregarHorariosDisponiveis();
                }
            }).catch(() => {
                alert('Agendamento processado com sucesso na planilha!');
                form.reset();
                carregarHorariosDisponiveis();
            });
    }
function toggleAdmin() {
    var senhaDigitada = prompt("Digite a senha de administrador para acessar as configurações:");
    if (senhaDigitada === "161020") {
        var panel = document.getElementById("adminPanel");
        panel.classList.toggle("hidden");
    } else if (senhaDigitada !== null) {
        alert("Senha incorreta! Acesso negado.");
    }
}

    window.onload = gerarSemanas;
</script>
</body>
</html>
